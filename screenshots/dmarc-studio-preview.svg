<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgDmarc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0e1329"/>
      <stop offset="100%" stop-color="#03040a"/>
    </linearGradient>
    <linearGradient id="gradLogoDmarc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gradScoreDmarc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bgDmarc)"/>

  <!-- Header -->
  <rect x="30" y="24" width="1140" height="60" rx="10" fill="#151c3d" stroke="#242f5d" stroke-width="1.5"/>
  <rect x="46" y="38" width="56" height="32" rx="6" fill="url(#gradLogoDmarc)"/>
  <text x="74" y="60" fill="#020617" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" text-anchor="middle">DMARC</text>
  <text x="114" y="58" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">DMARCForensics Pro</text>
  <text x="325" y="57" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">RFC 7489 / RFC 7960 DMARC Forensic &amp; Aggregate (RUA) XML Report Analyzer</text>

  <rect x="880" y="40" width="135" height="26" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="947" y="57" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">p=reject Enforced</text>
  <rect x="1025" y="40" width="130" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="1090" y="57" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">BIMI Ready</text>

  <!-- Left: Parameters & Inspector -->
  <rect x="30" y="104" width="555" height="360" rx="10" fill="#151c3d" stroke="#242f5d" stroke-width="1.5"/>
  <text x="50" y="134" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">1. Raw DMARC Aggregate (RUA) XML Report</text>

  <rect x="50" y="154" width="515" height="85" rx="6" fill="#0a0d1e" stroke="#242f5d"/>
  <text x="64" y="176" fill="#38bdf8" font-family="monospace" font-size="11">&lt;policy_published&gt;&lt;domain&gt;apexfinbank.com&lt;/domain&gt;&lt;p&gt;reject&lt;/p&gt;&lt;/policy_published&gt;</text>
  <text x="64" y="196" fill="#818cf8" font-family="monospace" font-size="11">&lt;record&gt;&lt;row&gt;&lt;source_ip&gt;209.85.220.41&lt;/source_ip&gt;&lt;count&gt;15400&lt;/count&gt;&lt;/row&gt;&lt;/record&gt;</text>
  <text x="64" y="216" fill="#f87171" font-family="monospace" font-size="11">&lt;record&gt;&lt;row&gt;&lt;source_ip&gt;185.220.101.5&lt;/source_ip&gt;&lt;count&gt;180&lt;/count&gt;&lt;disposition&gt;reject&lt;/disposition&gt;&lt;/row&gt;</text>

  <!-- Inspector Pills -->
  <rect x="50" y="255" width="250" height="50" rx="6" fill="#0e1329" stroke="#242f5d"/>
  <text x="64" y="273" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">DOMAIN &amp; PUBLISHED POLICY</text>
  <text x="64" y="293" fill="#ffffff" font-family="monospace" font-size="11">apexfinbank.com (p=reject)</text>

  <rect x="315" y="255" width="250" height="50" rx="6" fill="#0e1329" stroke="#242f5d"/>
  <text x="329" y="273" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">TOTAL VOLUME &amp; PASS RATE</text>
  <text x="329" y="293" fill="#10b981" font-family="monospace" font-size="11">19,780 msgs (99% Pass)</text>

  <rect x="50" y="315" width="250" height="50" rx="6" fill="#0e1329" stroke="#242f5d"/>
  <text x="64" y="333" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">BLOCKED PHISHING VOLUME</text>
  <text x="64" y="353" fill="#10b981" font-family="monospace" font-size="11">180 Rejected (0 Inboxes)</text>

  <rect x="315" y="315" width="250" height="50" rx="6" fill="#0e1329" stroke="#242f5d"/>
  <text x="329" y="333" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">REPORTING MAILBOX PROVIDER</text>
  <text x="329" y="353" fill="#38bdf8" font-family="monospace" font-size="11">google.com</text>

  <rect x="50" y="375" width="515" height="74" rx="6" fill="#0a0d1e" stroke="#242f5d"/>
  <text x="66" y="398" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">IDENTIFIER ALIGNMENT STATUS:</text>
  <text x="66" y="418" fill="#34d399" font-family="monospace" font-size="11">&#10003; 100% Legitimate Traffic Aligned (Google Workspace + SendGrid)</text>
  <text x="66" y="436" fill="#38bdf8" font-family="monospace" font-size="11">&#10003; 180 Phishing Attempts Blocked at Gateway via p=reject Policy</text>

  <!-- Right: 10-Point Scorecard -->
  <rect x="615" y="104" width="555" height="360" rx="10" fill="#151c3d" stroke="#242f5d" stroke-width="1.5"/>
  <text x="635" y="134" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">2. 10-Point Zero-Trust DMARC Scorecard</text>

  <rect x="635" y="152" width="515" height="74" rx="8" fill="#0e1329" stroke="#242f5d"/>
  <circle cx="678" cy="189" r="28" fill="url(#gradScoreDmarc)"/>
  <text x="678" y="196" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" text-anchor="middle">A+</text>
  <text x="722" y="180" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">100 / 100 Points</text>
  <text x="722" y="200" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12">Zero-Trust Enforced &bull; 10 Passed &bull; 0 Spoofing Risks</text>

  <!-- Checks List -->
  <rect x="635" y="238" width="515" height="32" rx="4" fill="#0a0d1e" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="258" fill="#34d399" font-family="monospace" font-size="11">[PASS] DMARC Policy (p=reject): Mailbox providers drop unauthenticated mail.</text>

  <rect x="635" y="278" width="515" height="32" rx="4" fill="#0a0d1e" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="298" fill="#34d399" font-family="monospace" font-size="11">[PASS] Subdomain Policy (sp=reject): Prevents spoofing across subdomains.</text>

  <rect x="635" y="318" width="515" height="32" rx="4" fill="#0a0d1e" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="338" fill="#34d399" font-family="monospace" font-size="11">[PASS] 100% Traffic Coverage: All inbound messages claiming domain inspected.</text>

  <rect x="635" y="358" width="515" height="32" rx="4" fill="#0a0d1e" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="378" fill="#34d399" font-family="monospace" font-size="11">[PASS] DKIM Alignment: 99% volume passed cryptographic signature check.</text>

  <rect x="635" y="398" width="515" height="32" rx="4" fill="#0a0d1e" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="418" fill="#34d399" font-family="monospace" font-size="11">[PASS] Spoofing Defense: Zero unauthenticated/spoofed messages reached inboxes.</text>

  <!-- Bottom: DNS Synthesizer -->
  <rect x="30" y="484" width="1140" height="190" rx="10" fill="#151c3d" stroke="#242f5d" stroke-width="1.5"/>
  <text x="50" y="514" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">3. Multi-Provider DNS Policy &amp; Record Synthesizer (Cloudflare, Route 53, BIND, Terraform)</text>

  <rect x="50" y="528" width="1100" height="130" rx="6" fill="#0a0d1e" stroke="#242f5d"/>
  <text x="66" y="552" fill="#38bdf8" font-family="monospace" font-size="12">; Cloudflare DNS Zone Records for apexfinbank.com</text>
  <text x="66" y="572" fill="#cbd5e1" font-family="monospace" font-size="12">_dmarc.apexfinbank.com.  300  IN  TXT  "v=DMARC1; p=reject; sp=reject; pct=100; rua=mailto:dmarc-rua@apexfinbank.com; fo=1;"</text>
  <text x="66" y="592" fill="#34d399" font-family="monospace" font-size="12">apexfinbank.com.         300  IN  TXT  "v=spf1 include:_spf.google.com include:sendgrid.net ~all"</text>
  <text x="66" y="612" fill="#94a3b8" font-family="monospace" font-size="12">; Enforces strict gateway rejection while maintaining 100% primary inbox deliverability</text>
</svg>
